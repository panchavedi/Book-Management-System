<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#eef7ff"/><stop offset="55%" stop-color="#f9fdf8"/><stop offset="100%" stop-color="#fff3f7"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".14"/>
  </filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 z" fill="#51606f"/>
  </marker>
</defs>
<rect width="1500" height="850" rx="28" fill="url(#bg)"/>
<text x="70" y="82" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="800" fill="#16324f">Transaction-Aware Image Lifecycle</text>
<text x="70" y="120" font-family="Inter,Arial,sans-serif" font-size="19" fill="#52677a">Database metadata and filesystem side effects are coordinated with transaction outcome.</text>

<line x1="340" y1="295" x2="420" y2="260" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="720" y1="260" x2="820" y2="260" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="720" y1="520" x2="820" y2="520" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="1110" y1="265" x2="1190" y2="355" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="1110" y1="515" x2="1190" y2="395" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
<rect x="70" y="220" width="270" height="150" rx="22" fill="#e6f4ff" stroke="#5aa8e6" stroke-width="3"/>
<text x="94" y="258" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="800" fill="#17324d">Upload</text>
<text x="94" y="292" font-family="Inter,Arial,sans-serif" font-size="16" fill="#51606f">Validate type • size • decode</text>
</g>
<g filter="url(#shadow)">
<rect x="420" y="170" width="300" height="180" rx="22" fill="#fff5df" stroke="#e5a83b" stroke-width="3"/>
<text x="444" y="208" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="800" fill="#17324d">Filesystem</text>
<text x="444" y="242" font-family="Inter,Arial,sans-serif" font-size="16" fill="#51606f">Write new UUID-named files</text>
</g>
<g filter="url(#shadow)">
<rect x="420" y="430" width="300" height="180" rx="22" fill="#eef2ff" stroke="#7c83fd" stroke-width="3"/>
<text x="444" y="468" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="800" fill="#17324d">Database</text>
<text x="444" y="502" font-family="Inter,Arial,sans-serif" font-size="16" fill="#51606f">Persist image metadata</text>
</g>
<g filter="url(#shadow)">
<rect x="820" y="180" width="290" height="170" rx="22" fill="#e9fbf2" stroke="#4db37a" stroke-width="3"/>
<text x="844" y="218" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="800" fill="#17324d">Transaction</text>
<text x="844" y="252" font-family="Inter,Arial,sans-serif" font-size="16" fill="#51606f">DB + application state</text>
</g>
<g filter="url(#shadow)">
<rect x="820" y="430" width="290" height="170" rx="22" fill="#f4ecff" stroke="#a56ee8" stroke-width="3"/>
<text x="844" y="468" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="800" fill="#17324d">afterCommit()</text>
<text x="844" y="502" font-family="Inter,Arial,sans-serif" font-size="16" fill="#51606f">Delete replaced/old files</text>
</g>
<g filter="url(#shadow)">
<rect x="1190" y="305" width="230" height="170" rx="22" fill="#fff0f3" stroke="#df7187" stroke-width="3"/>
<text x="1214" y="343" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="800" fill="#17324d">Rollback</text>
<text x="1214" y="377" font-family="Inter,Arial,sans-serif" font-size="16" fill="#51606f">Remove newly created files</text>
</g>
<text x="70" y="810" font-family="Inter,Arial,sans-serif" font-size="16" fill="#718096">KnowledgeHub • Book Management System</text></svg>
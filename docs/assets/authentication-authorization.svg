<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#eef7ff"/><stop offset="55%" stop-color="#f9fdf8"/><stop offset="100%" stop-color="#fff3f7"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".14"/>
  </filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 z" fill="#51606f"/>
  </marker>
</defs>
<rect width="1500" height="850" rx="28" fill="url(#bg)"/>
<text x="70" y="82" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="800" fill="#16324f">Authentication &amp; Authorization Strategy</text>
<text x="70" y="120" font-family="Inter,Arial,sans-serif" font-size="19" fill="#52677a">Identity is issued by the User Service and independently verified by protected downstream services.</text>

<line x1="320" y1="305" x2="385" y2="285" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="675" y1="285" x2="755" y2="190" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="900" y1="260" x2="900" y2="315" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="1040" y1="385" x2="1120" y2="385" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="1270" y1="455" x2="1270" y2="515" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
<rect x="70" y="235" width="250" height="140" rx="22" fill="#fff0f3" stroke="#df7187" stroke-width="3"/>
<text x="94" y="273" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="800" fill="#17324d">Sign In</text>
<text x="94" y="307" font-family="Inter,Arial,sans-serif" font-size="16" fill="#51606f">Username + password</text>
</g>
<g filter="url(#shadow)">
<rect x="385" y="190" width="290" height="190" rx="22" fill="#e9fbf2" stroke="#4db37a" stroke-width="3"/>
<text x="409" y="228" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="800" fill="#17324d">User Service</text>
<text x="409" y="262" font-family="Inter,Arial,sans-serif" font-size="16" fill="#51606f">Authenticate • issue RSA/RS256 JWT</text>
</g>
<g filter="url(#shadow)">
<rect x="755" y="120" width="285" height="140" rx="22" fill="#eef2ff" stroke="#7c83fd" stroke-width="3"/>
<text x="779" y="158" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="800" fill="#17324d">JWT</text>
<text x="779" y="192" font-family="Inter,Arial,sans-serif" font-size="16" fill="#51606f">userId • role • issuer • audience • exp</text>
</g>
<g filter="url(#shadow)">
<rect x="755" y="315" width="285" height="140" rx="22" fill="#e6f4ff" stroke="#5aa8e6" stroke-width="3"/>
<text x="779" y="353" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="800" fill="#17324d">API Gateway</text>
<text x="779" y="387" font-family="Inter,Arial,sans-serif" font-size="16" fill="#51606f">Route authenticated requests</text>
</g>
<g filter="url(#shadow)">
<rect x="1120" y="315" width="300" height="140" rx="22" fill="#f4ecff" stroke="#a56ee8" stroke-width="3"/>
<text x="1144" y="353" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="800" fill="#17324d">Library Service</text>
<text x="1144" y="387" font-family="Inter,Arial,sans-serif" font-size="16" fill="#51606f">Verify JWT locally • authorize action</text>
</g>
<g filter="url(#shadow)">
<rect x="1120" y="515" width="300" height="140" rx="22" fill="#fff5df" stroke="#e5a83b" stroke-width="3"/>
<text x="1144" y="553" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="800" fill="#17324d">Business Rules</text>
<text x="1144" y="587" font-family="Inter,Arial,sans-serif" font-size="16" fill="#51606f">Ownership • admin rules • transactions</text>
</g>
<text x="70" y="810" font-family="Inter,Arial,sans-serif" font-size="16" fill="#718096">KnowledgeHub • Book Management System</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#eef7ff"/><stop offset="55%" stop-color="#f9fdf8"/><stop offset="100%" stop-color="#fff3f7"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".14"/>
  </filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 z" fill="#51606f"/>
  </marker>
</defs>
<rect width="1500" height="850" rx="28" fill="url(#bg)"/>
<text x="70" y="82" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="800" fill="#16324f">Race-Safe Borrowing</text>
<text x="70" y="120" font-family="Inter,Arial,sans-serif" font-size="19" fill="#52677a">Inventory correctness is enforced at the database boundary instead of relying on application timing.</text>

<line x1="340" y1="255" x2="430" y2="315" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="340" y1="485" x2="430" y2="375" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="730" y1="345" x2="820" y2="225" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="970" y1="300" x2="970" y2="370" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="1120" y1="445" x2="1190" y2="345" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
<rect x="70" y="180" width="270" height="150" rx="22" fill="#e6f4ff" stroke="#5aa8e6" stroke-width="3"/>
<text x="94" y="218" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="800" fill="#17324d">Request A</text>
<text x="94" y="252" font-family="Inter,Arial,sans-serif" font-size="16" fill="#51606f">Borrow Book #42</text>
</g>
<g filter="url(#shadow)">
<rect x="70" y="410" width="270" height="150" rx="22" fill="#eef2ff" stroke="#7c83fd" stroke-width="3"/>
<text x="94" y="448" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="800" fill="#17324d">Request B</text>
<text x="94" y="482" font-family="Inter,Arial,sans-serif" font-size="16" fill="#51606f">Same book • arrives concurrently</text>
</g>
<g filter="url(#shadow)">
<rect x="430" y="250" width="300" height="190" rx="22" fill="#fff5df" stroke="#e5a83b" stroke-width="3"/>
<text x="454" y="288" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="800" fill="#17324d">Pessimistic Lock</text>
<text x="454" y="322" font-family="Inter,Arial,sans-serif" font-size="16" fill="#51606f">PESSIMISTIC_WRITE on book row</text>
</g>
<g filter="url(#shadow)">
<rect x="820" y="150" width="300" height="150" rx="22" fill="#e9fbf2" stroke="#4db37a" stroke-width="3"/>
<text x="844" y="188" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="800" fill="#17324d">Check Availability</text>
<text x="844" y="222" font-family="Inter,Arial,sans-serif" font-size="16" fill="#51606f">availableCopies &gt; 0</text>
</g>
<g filter="url(#shadow)">
<rect x="820" y="370" width="300" height="150" rx="22" fill="#f4ecff" stroke="#a56ee8" stroke-width="3"/>
<text x="844" y="408" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="800" fill="#17324d">Atomic Mutation</text>
<text x="844" y="442" font-family="Inter,Arial,sans-serif" font-size="16" fill="#51606f">decrement + borrowing record</text>
</g>
<g filter="url(#shadow)">
<rect x="1190" y="250" width="230" height="190" rx="22" fill="#fff0f3" stroke="#df7187" stroke-width="3"/>
<text x="1214" y="288" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="800" fill="#17324d">Commit</text>
<text x="1214" y="322" font-family="Inter,Arial,sans-serif" font-size="16" fill="#51606f">One serialized decision</text>
</g>
<text x="70" y="810" font-family="Inter,Arial,sans-serif" font-size="16" fill="#718096">KnowledgeHub • Book Management System</text></svg>
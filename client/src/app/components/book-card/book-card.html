<article class="book-card">
  <a class="cover-link" [routerLink]="['/books', book.id]">
    <app-book-cover [title]="book.title" [images]="book.images" size="medium" />
  </a>
  <div class="meta">
    <span class="category">{{ book.categoryName || 'Library' }}</span>
    <h2>
      <a [routerLink]="['/books', book.id]">{{ book.title }}</a>
    </h2>
    <p>{{ book.authorName || 'Unknown author' }}</p>
    <div class="availability-row">
      <span class="status-dot" [class.unavailable]="book.availableCopies === 0">
      </span>
      <span>{{ availabilityLabel }}</span>
      <span>· {{ book.availableCopies }} left</span>
    </div>
  </div>
  @if (book.borrowed && !admin) { <span class="borrow-state">Currently borrowed</span> }
  @if (admin) {
  <div class="actions">
    <a class="edit-action" [routerLink]="['/books', book.id, 'edit']">Edit</a>
    <button class="delete-action" type="button" (click)="deleteBook.emit(book)">Delete</button>
  </div>
  }
</article>

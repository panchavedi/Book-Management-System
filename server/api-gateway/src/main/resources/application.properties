spring.application.name=api-gateway
server.port=8085

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth,/auth/**

spring.cloud.gateway.routes[1].id=library-service
spring.cloud.gateway.routes[1].uri=lb://LIBRARY-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/books,/books/**,/borrow,/borrow/**
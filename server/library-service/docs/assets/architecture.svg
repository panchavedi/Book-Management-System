<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620">
<defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".28"/></filter></defs>
<rect width="1400" height="620" rx="30" fill="url(#bg)"/>
<text x="70" y="70" fill="#f8fafc" font-family="Inter,Segoe UI,Arial" font-size="34" font-weight="700">Library Service — Runtime Architecture</text>
<text x="70" y="108" fill="#94a3b8" font-family="Inter,Segoe UI,Arial" font-size="18">Stateless security • transactional domain logic • race-safe inventory • storage consistency</text>
<g filter="url(#s)">
<rect x="70" y="180" width="240" height="150" rx="22" fill="#2563eb"/><text x="190" y="235" text-anchor="middle" fill="white" font-size="24" font-weight="700" font-family="Arial">Client / UI</text><text x="190" y="272" text-anchor="middle" fill="#dbeafe" font-size="17" font-family="Arial">Bearer JWT</text><text x="190" y="300" text-anchor="middle" fill="#dbeafe" font-size="17" font-family="Arial">JSON + multipart</text>
<rect x="390" y="150" width="300" height="210" rx="22" fill="#7c3aed"/><text x="540" y="205" text-anchor="middle" fill="white" font-size="24" font-weight="700" font-family="Arial">Library Service</text><text x="540" y="242" text-anchor="middle" fill="#ede9fe" font-size="17" font-family="Arial">Spring Security Resource Server</text><text x="540" y="272" text-anchor="middle" fill="#ede9fe" font-size="17" font-family="Arial">Controllers → Services → JPA</text><text x="540" y="302" text-anchor="middle" fill="#ede9fe" font-size="17" font-family="Arial">Pessimistic + optimistic locking</text><text x="540" y="332" text-anchor="middle" fill="#ede9fe" font-size="17" font-family="Arial">Transaction-aware file lifecycle</text>
<rect x="790" y="145" width="250" height="160" rx="22" fill="#059669"/><text x="915" y="200" text-anchor="middle" fill="white" font-size="23" font-weight="700" font-family="Arial">PostgreSQL</text><text x="915" y="238" text-anchor="middle" fill="#d1fae5" font-size="17" font-family="Arial">Books • Authors</text><text x="915" y="266" text-anchor="middle" fill="#d1fae5" font-size="17" font-family="Arial">Categories • Borrowings</text><text x="915" y="294" text-anchor="middle" fill="#d1fae5" font-size="17" font-family="Arial">Image metadata</text>
<rect x="790" y="365" width="250" height="145" rx="22" fill="#ea580c"/><text x="915" y="420" text-anchor="middle" fill="white" font-size="23" font-weight="700" font-family="Arial">File Storage</text><text x="915" y="458" text-anchor="middle" fill="#ffedd5" font-size="17" font-family="Arial">Validated images</text><text x="915" y="486" text-anchor="middle" fill="#ffedd5" font-size="17" font-family="Arial">Rollback-safe cleanup</text>
<rect x="1110" y="200" width="220" height="150" rx="22" fill="#0891b2"/><text x="1220" y="255" text-anchor="middle" fill="white" font-size="23" font-weight="700" font-family="Arial">User Service</text><text x="1220" y="293" text-anchor="middle" fill="#cffafe" font-size="17" font-family="Arial">Profile enrichment</text><text x="1220" y="321" text-anchor="middle" fill="#cffafe" font-size="17" font-family="Arial">Feign + token relay</text>
</g>
<g stroke="#94a3b8" stroke-width="4" fill="none"><path d="M310 255 H390"/><path d="M690 225 H790"/><path d="M690 305 C740 305 735 435 790 435"/><path d="M1040 245 H1110"/></g>
<g fill="#94a3b8"><polygon points="382,247 398,255 382,263"/><polygon points="782,217 798,225 782,233"/><polygon points="782,427 798,435 782,443"/><polygon points="1102,237 1118,245 1102,253"/></g>
<text x="70" y="565" fill="#cbd5e1" font-family="Arial" font-size="17">Designed so authentication is local, identity is trusted, inventory updates are serialized per book, and file side-effects respect DB commit/rollback.</text>
</svg>

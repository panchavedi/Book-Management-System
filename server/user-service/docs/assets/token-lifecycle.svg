<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#08111f"/><stop offset="55%" stop-color="#111c35"/><stop offset="100%" stop-color="#1b1235"/></linearGradient>
 <linearGradient id="g1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
 <linearGradient id="g2"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
 <linearGradient id="g3"><stop stop-color="#34d399"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".35"/></filter>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#94a3b8"/></marker>
</defs>
<rect width="1200" height="650" rx="30" fill="url(#bg)"/>
<circle cx="1080" cy="80" r="150" fill="#6366f1" opacity=".08"/>
<circle cx="80" cy="570" r="180" fill="#06b6d4" opacity=".06"/>
<text x="60" y="65" fill="#f8fafc" font-family="Arial, sans-serif" font-size="31" font-weight="700">Token Lifecycle — Stateless by Default, Revocable When Needed</text>
<text x="60" y="98" fill="#94a3b8" font-family="Arial, sans-serif" font-size="16">JWT carries identity; a compact revocation index adds logout semantics.</text>

<g filter="url(#shadow)">
<rect x="55" y="155" width="210" height="145" rx="18" fill="url(#g1)" opacity=".95"/>
<rect x="55" y="155" width="210" height="6" rx="3" fill="url(#g1)"/>
<text x="75" y="193" fill="#fff" font-family="Arial, sans-serif" font-size="19" font-weight="700">1 · Login</text>
<text x="75" y="221" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14">Authenticate credentials</text>
</g>
<g filter="url(#shadow)">
<rect x="295" y="155" width="210" height="145" rx="18" fill="url(#g2)" opacity=".95"/>
<rect x="295" y="155" width="210" height="6" rx="3" fill="url(#g1)"/>
<text x="315" y="193" fill="#fff" font-family="Arial, sans-serif" font-size="19" font-weight="700">2 · Issue</text>
<text x="315" y="221" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14">RS256 JWT</text>
<text x="315" y="243" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14">1 hour expiry</text>
</g>
<g filter="url(#shadow)">
<rect x="535" y="155" width="210" height="145" rx="18" fill="url(#g3)" opacity=".95"/>
<rect x="535" y="155" width="210" height="6" rx="3" fill="url(#g1)"/>
<text x="555" y="193" fill="#fff" font-family="Arial, sans-serif" font-size="19" font-weight="700">3 · Use</text>
<text x="555" y="221" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14">Bearer token</text>
<text x="555" y="243" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14">no server session</text>
</g>
<g filter="url(#shadow)">
<rect x="775" y="155" width="210" height="145" rx="18" fill="url(#g2)" opacity=".95"/>
<rect x="775" y="155" width="210" height="6" rx="3" fill="url(#g1)"/>
<text x="795" y="193" fill="#fff" font-family="Arial, sans-serif" font-size="19" font-weight="700">4 · Logout</text>
<text x="795" y="221" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14">Hash token</text>
<text x="795" y="243" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14">store until expiry</text>
</g>
<g filter="url(#shadow)">
<rect x="1015" y="155" width="130" height="145" rx="18" fill="url(#g1)" opacity=".95"/>
<rect x="1015" y="155" width="130" height="6" rx="3" fill="url(#g1)"/>
<text x="1035" y="193" fill="#fff" font-family="Arial, sans-serif" font-size="19" font-weight="700">5 · Reject</text>
<text x="1035" y="221" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14">Revoked? 401</text>
</g>
<g filter="url(#shadow)">
<rect x="220" y="390" width="260" height="145" rx="18" fill="url(#g3)" opacity=".95"/>
<rect x="220" y="390" width="260" height="6" rx="3" fill="url(#g1)"/>
<text x="240" y="428" fill="#fff" font-family="Arial, sans-serif" font-size="19" font-weight="700">Fast Path</text>
<text x="240" y="456" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14">Normal requests</text>
<text x="240" y="478" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14">validate signature +</text>
<text x="240" y="500" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14">claims</text>
</g>
<g filter="url(#shadow)">
<rect x="520" y="390" width="260" height="145" rx="18" fill="url(#g1)" opacity=".95"/>
<rect x="520" y="390" width="260" height="6" rx="3" fill="url(#g1)"/>
<text x="540" y="428" fill="#fff" font-family="Arial, sans-serif" font-size="19" font-weight="700">Revocation Index</text>
<text x="540" y="456" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14">Unique token hash</text>
<text x="540" y="478" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14">expiry index</text>
</g>
<g filter="url(#shadow)">
<rect x="820" y="390" width="260" height="145" rx="18" fill="url(#g2)" opacity=".95"/>
<rect x="820" y="390" width="260" height="6" rx="3" fill="url(#g1)"/>
<text x="840" y="428" fill="#fff" font-family="Arial, sans-serif" font-size="19" font-weight="700">Retention</text>
<text x="840" y="456" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14">Expired hashes are</text>
<text x="840" y="478" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14">removed automatically</text>
</g>
<line x1="265" y1="227" x2="295" y2="227" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="505" y1="227" x2="535" y2="227" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="745" y1="227" x2="775" y2="227" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="985" y1="227" x2="1015" y2="227" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="480" y1="462" x2="520" y2="462" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="780" y1="462" x2="820" y2="462" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
<text x="60" y="610" fill="#67e8f9" font-family="Arial, sans-serif" font-size="15" font-weight="700">Hybrid security model: stateless JWT performance + explicit logout invalidation.</text>
</svg>
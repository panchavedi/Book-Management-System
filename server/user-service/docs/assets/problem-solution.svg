<text x="985" y="183" fill="#fff" font-family="Arial, sans-serif" font-size="19" font-weight="700">Outcome</text>
<text x="985" y="211" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14">No accidental</text>
<text x="985" y="233" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14">overselling</text>
</g>

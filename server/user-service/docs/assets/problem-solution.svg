<text x="60" y="65" fill="#f8fafc" font-family="Arial, sans-serif" font-size="31" font-weight="700">From Library-System Risks → Explicit Engineering Controls</text>
<text x="60" y="98" fill="#94a3b8" font-family="Arial, sans-serif" font-size="16">Every important failure mode is answered by a deliberate strategy.</text>

<g filter="url(#shadow)">
<rect x="55" y="145" width="250" height="150" rx="18" fill="url(#g2)" opacity=".95"/>
<rect x="55" y="145" width="250" height="6" rx="3" fill="url(#g1)"/>
<text x="75" y="183" fill="#fff" font-family="Arial, sans-serif" font-size="19" font-weight="700">Problem</text>
<text x="75" y="211" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14">Concurrent borrowing</text>
<text x="75" y="233" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14">Stale inventory decisions</text>
</g>

<text x="985" y="398" fill="#fff" font-family="Arial, sans-serif" font-size="19" font-weight="700">Outcome</text>
<text x="985" y="426" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14">Defensible</text>
<text x="985" y="448" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14">security model</text>

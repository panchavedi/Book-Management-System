<text x="345" y="426" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14">RSA validation +</text>
<text x="345" y="448" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14">hashed revocation</text>
</g>
<g filter="url(#shadow)">
<rect x="645" y="360" width="250" height="150" rx="18" fill="url(#g3)" opacity=".95"/>
<rect x="645" y="360" width="250" height="6" rx="3" fill="url(#g1)"/>
<text x="665" y="398" fill="#fff" font-family="Arial, sans-serif" font-size="19" font-weight="700">Result</text>
<text x="665" y="426" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14">Stateless requests</text>
<text x="665" y="448" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14">with explicit invalidation</text>
</g>

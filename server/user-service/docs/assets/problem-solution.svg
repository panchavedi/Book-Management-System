<line x1="895" y1="435" x2="965" y2="435" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
<text x="60" y="610" fill="#67e8f9" font-family="Arial, sans-serif" font-size="15" font-weight="700">Design principle: do not rely on application code alone when the database can enforce correctness.</text>

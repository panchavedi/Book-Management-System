<text x="75" y="398" fill="#fff" font-family="Arial, sans-serif" font-size="19" font-weight="700">Problem</text>
<text x="75" y="426" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14">JWT theft / logout</text>
<text x="75" y="448" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14">must matter</text>
</g>

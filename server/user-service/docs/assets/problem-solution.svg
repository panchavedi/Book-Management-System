<text x="345" y="211" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14">Pessimistic row locking</text>
<text x="345" y="233" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14">Transaction boundary</text>
</g>
<g filter="url(#shadow)">

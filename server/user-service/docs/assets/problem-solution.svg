<text x="665" y="183" fill="#fff" font-family="Arial, sans-serif" font-size="19" font-weight="700">Result</text>
<text x="665" y="211" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14">One authoritative</text>
<text x="665" y="233" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14">inventory decision</text>
</g>
<g filter="url(#shadow)">
<rect x="965" y="145" width="180" height="150" rx="18" fill="url(#g2)" opacity=".95"/>

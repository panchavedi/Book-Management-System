<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#08111f"/><stop offset="55%" stop-color="#111c35"/><stop offset="100%" stop-color="#1b1235"/></linearGradient>
 <linearGradient id="g1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
 <linearGradient id="g2"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
 <linearGradient id="g3"><stop stop-color="#34d399"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".35"/></filter>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#94a3b8"/></marker>
</defs>
<rect width="1200" height="650" rx="30" fill="url(#bg)"/>
<circle cx="1080" cy="80" r="150" fill="#6366f1" opacity=".08"/>
<circle cx="80" cy="570" r="180" fill="#06b6d4" opacity=".06"/>
<text x="60" y="65" fill="#f8fafc" font-family="Arial, sans-serif" font-size="31" font-weight="700">Security Strategy — Trust the Signature, Not the Client</text>
<text x="60" y="98" fill="#94a3b8" font-family="Arial, sans-serif" font-size="16">Identity and authorization are derived from a signed token and server-side policy.</text>

<g filter="url(#shadow)">
<rect x="50" y="150" width="220" height="155" rx="18" fill="url(#g1)" opacity=".95"/>
<rect x="50" y="150" width="220" height="6" rx="3" fill="url(#g1)"/>
<text x="70" y="188" fill="#fff" font-family="Arial, sans-serif" font-size="19" font-weight="700">Credentials</text>
<text x="70" y="216" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14">username + password</text>
<text x="70" y="238" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14">validated by Spring Security</text>
<text x="70" y="260" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14">password encoder</text>
</g>
<g filter="url(#shadow)">
<rect x="300" y="150" width="220" height="155" rx="18" fill="url(#g2)" opacity=".95"/>
<rect x="300" y="150" width="220" height="6" rx="3" fill="url(#g1)"/>
<text x="320" y="188" fill="#fff" font-family="Arial, sans-serif" font-size="19" font-weight="700">Token Issuer</text>
<text x="320" y="216" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14">RSA private key</text>
<text x="320" y="238" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14">RS256 signature</text>
<text x="320" y="260" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14">userId + role + subject</text>
</g>
<g filter="url(#shadow)">
<rect x="550" y="150" width="220" height="155" rx="18" fill="url(#g3)" opacity=".95"/>
<rect x="550" y="150" width="220" height="6" rx="3" fill="url(#g1)"/>
<text x="570" y="188" fill="#fff" font-family="Arial, sans-serif" font-size="19" font-weight="700">Resource Server</text>
<text x="570" y="216" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14">RSA public key</text>
<text x="570" y="238" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14">signature + expiry</text>
<text x="570" y="260" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14">validated automatically</text>
</g>
<g filter="url(#shadow)">
<rect x="800" y="150" width="220" height="155" rx="18" fill="url(#g2)" opacity=".95"/>
<rect x="800" y="150" width="220" height="6" rx="3" fill="url(#g1)"/>
<text x="820" y="188" fill="#fff" font-family="Arial, sans-serif" font-size="19" font-weight="700">Role Converter</text>
<text x="820" y="216" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14">role → ROLE_* authority</text>
<text x="820" y="238" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14">revocation check</text>
<text x="820" y="260" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14">invalid role rejected</text>
</g>
<g filter="url(#shadow)">
<rect x="1050" y="150" width="100" height="155" rx="18" fill="url(#g1)" opacity=".95"/>
<rect x="1050" y="150" width="100" height="6" rx="3" fill="url(#g1)"/>
<text x="1070" y="188" fill="#fff" font-family="Arial, sans-serif" font-size="19" font-weight="700">API</text>
<text x="1070" y="216" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14">Allow /</text>
<text x="1070" y="238" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14">Deny</text>
</g>
<g filter="url(#shadow)">
<rect x="180" y="400" width="260" height="145" rx="18" fill="url(#g2)" opacity=".95"/>
<rect x="180" y="400" width="260" height="6" rx="3" fill="url(#g1)"/>
<text x="200" y="438" fill="#fff" font-family="Arial, sans-serif" font-size="19" font-weight="700">Logout</text>
<text x="200" y="466" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14">SHA-256 token hash</text>
<text x="200" y="488" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14">stored with expiry</text>
<text x="200" y="510" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14">raw token is not persisted</text>
</g>
<g filter="url(#shadow)">
<rect x="470" y="400" width="260" height="145" rx="18" fill="url(#g3)" opacity=".95"/>
<rect x="470" y="400" width="260" height="6" rx="3" fill="url(#g1)"/>
<text x="490" y="438" fill="#fff" font-family="Arial, sans-serif" font-size="19" font-weight="700">Cleanup</text>
<text x="490" y="466" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14">Scheduled deletion</text>
<text x="490" y="488" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14">of expired revocations</text>
</g>
<g filter="url(#shadow)">
<rect x="760" y="400" width="300" height="145" rx="18" fill="url(#g1)" opacity=".95"/>
<rect x="760" y="400" width="300" height="6" rx="3" fill="url(#g1)"/>
<text x="780" y="438" fill="#fff" font-family="Arial, sans-serif" font-size="19" font-weight="700">Authorization</text>
<text x="780" y="466" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14">/user/me → subject</text>
<text x="780" y="488" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14">{id} → userId claim</text>
<text x="780" y="510" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14">admin → ROLE_ADMIN</text>
</g>
<line x1="270" y1="227" x2="300" y2="227" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="520" y1="227" x2="550" y2="227" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="770" y1="227" x2="800" y2="227" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="1020" y1="227" x2="1050" y2="227" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="400" y1="472" x2="470" y2="472" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="730" y1="472" x2="760" y2="472" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
<text x="60" y="610" fill="#67e8f9" font-family="Arial, sans-serif" font-size="15" font-weight="700">The client supplies a token; the server decides what that token proves and what it permits.</text>
</svg>